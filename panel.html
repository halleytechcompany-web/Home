<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luz</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root { --bg:#14181c; --fg:#e8ecef; --on:#f2c14e; --off:#3a434b; --err:#e5726b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  main { text-align:center; padding:24px; }
  #lamp { width:120px; height:120px; border-radius:50%; margin:0 auto 20px;
          background:var(--off); transition:background .2s, box-shadow .2s; }
  #lamp.on { background:var(--on); box-shadow:0 0 48px var(--on); }
  #status { margin:0 0 24px; min-height:1.4em; }
  #status.error { color:var(--err); }
  button { font:inherit; padding:12px 22px; margin:0 6px; border:2px solid var(--fg);
           background:none; color:var(--fg); border-radius:8px; cursor:pointer; }
  button:hover { background:var(--fg); color:var(--bg); }
  button:focus-visible { outline:3px solid var(--on); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <div id="lamp"></div>
  <p id="status">Conectando…</p>
  <button data-cmd="1">Encender</button>
  <button data-cmd="0">Apagar</button>
</main>
<script>
  // El tema NO va en el código (este archivo es público en GitHub).
  // Ábrelo una vez como panel.html#TU-TEMA (ej: ...#adri-k7x2m9qv4tz8nw3p/luz) y queda guardado.
  let base = decodeURIComponent(location.hash.slice(1));
  try {
    if (base) localStorage.setItem("base", base); else base = localStorage.getItem("base") || "";
  } catch (e) {}
  if (!base) base = prompt("Tema del dispositivo (el mismo de init.lua, sin /cmd):") || "";
  if (base) { try { localStorage.setItem("base", base); } catch (e) {} }

  const T_CMD = base + "/cmd", T_STATE = base + "/estado";
  const lamp = document.getElementById("lamp");
  const status = document.getElementById("status");
  const setStatus = (t, err) => { status.textContent = t; status.classList.toggle("error", !!err); };

  const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt", { reconnectPeriod: 3000 });

  client.on("connect", () => { setStatus("Conectado al broker"); client.subscribe(T_STATE); });
  client.on("reconnect", () => setStatus("Reconectando…", true));
  client.on("error", () => setStatus("No se pudo conectar al broker", true));

  client.on("message", (_, payload) => {
    const s = payload.toString();
    lamp.classList.toggle("on", s === "on");
    setStatus(s === "offline" ? "El ESP-01 está desconectado" : s === "on" ? "Luz encendida" : "Luz apagada", s === "offline");
  });

  // retain: el chip recupera la última orden si se reinicia.
  document.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => client.publish(T_CMD, b.dataset.cmd, { retain: true })));
</script>
</body>
</html>
