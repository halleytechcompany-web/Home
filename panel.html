<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luz</title>
<style>
  :root { --bg:#14181c; --fg:#e8ecef; --on:#f2c14e; --off:#3a434b; --err:#e5726b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  main { text-align:center; padding:24px; }
  #lamp { width:120px; height:120px; border-radius:50%; margin:0 auto 20px;
          background:var(--off); transition:background .2s, box-shadow .2s; }
  #lamp.on { background:var(--on); box-shadow:0 0 48px var(--on); }
  #status { margin:0 0 24px; min-height:1.4em; }
  #status.error { color:var(--err); }
  button { font:inherit; padding:12px 22px; margin:0 6px; border:2px solid var(--fg);
           background:none; color:var(--fg); border-radius:8px; cursor:pointer; }
  button:hover { background:var(--fg); color:var(--bg); }
  button:focus-visible { outline:3px solid var(--on); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <div id="lamp"></div>
  <p id="status">Conectando…</p>
  <button data-cmd="1">Encender</button>
  <button data-cmd="0">Apagar</button>
</main>
<script>
  // Si el panel está en otro sitio, pon la dirección completa: "https://tu-dominio.com/cmd.php"
  const ENDPOINT = "cmd.php";
  const KEY = "cambia_esta_clave_del_panel";   // igual a PANEL_KEY en cmd.php
  const OFFLINE_AFTER = 15;                    // segundos sin noticias del ESP-01

  const lamp = document.getElementById("lamp");
  const status = document.getElementById("status");
  const setStatus = (t, err) => { status.textContent = t; status.classList.toggle("error", !!err); };

  async function call(cmd) {
    const body = new URLSearchParams({ k: KEY });
    if (cmd !== undefined) body.set("c", cmd);
    try {
      const r = await fetch(ENDPOINT, { method: "POST", body });
      if (!r.ok) throw new Error(r.status);
      render(await r.json());
    } catch (e) {
      setStatus("No se pudo contactar con el servidor", true);
    }
  }

  function render(d) {
    lamp.classList.toggle("on", d.state === "1");
    if (d.ago === null || d.ago > OFFLINE_AFTER) return setStatus("El ESP-01 está desconectado", true);
    if (d.cmd !== d.state) return setStatus("Esperando al ESP-01…");
    setStatus(d.state === "1" ? "Luz encendida" : "Luz apagada");
  }

  document.querySelectorAll("button").forEach(b => b.addEventListener("click", () => call(b.dataset.cmd)));
  call();
  setInterval(call, 2000);
</script>
</body>
</html>
